<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crecer en Renca — Indicadores 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    padding: 2rem 1rem;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; }
  .header {
    background: #fff;
    border-radius: 16px;
    padding: 2rem 2rem 1.5rem;
    margin-bottom: 1.5rem;
    border: 0.5px solid #e0dfd8;
  }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .header h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .header p { font-size: 13px; color: #888; }
  .update-badge { font-size: 11px; background: #f0f8f4; color: #0f6e56; border-radius: 20px; padding: 4px 12px; white-space: nowrap; }
  .filter-bar { margin-top: 1.25rem; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    font-size: 12px; padding: 5px 14px; border-radius: 20px;
    border: 0.5px solid #d0cfc8; background: #fff; color: #555;
    cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { background: #f5f4f0; }
  .filter-btn.active { background: #1a3a2a; color: #fff; border-color: #1a3a2a; }
  .loader { text-align: center; padding: 3rem; color: #888; font-size: 14px; background: #fff; border-radius: 16px; border: 0.5px solid #e0dfd8; }
  .error-msg { padding: 1.5rem 2rem; color: #712b13; font-size: 13px; background: #faece7; border-radius: 12px; line-height: 1.7; }
  .error-msg strong { display: block; font-size: 14px; margin-bottom: 6px; }

  .program-block { background: #fff; border-radius: 16px; border: 0.5px solid #e0dfd8; margin-bottom: 1rem; overflow: hidden; }
  .program-header {
    padding: 14px 20px; display: flex; align-items: center; gap: 10px;
    border-bottom: 0.5px solid #f0efe8; cursor: pointer; user-select: none;
  }
  .program-header:hover { background: #fafaf8; }
  .program-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .program-name { font-size: 14px; font-weight: 500; color: #1a1a1a; flex: 1; }
  .program-count { font-size: 11px; color: #aaa; }
  .chevron { font-size: 12px; color: #bbb; transition: transform 0.2s; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }
  .program-body { padding: 16px 20px 20px; display: none; }
  .program-body.open { display: block; }

  .ind-block { margin-bottom: 18px; }
  .ind-block:last-child { margin-bottom: 0; }
  .ind-label { font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .divider { height: 0.5px; background: #f0efe8; margin: 16px 0; }

  .a-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .a-card { background: #f5f4f0; border-radius: 10px; padding: 14px 16px; }
  .a-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 9px; border-radius: 20px; margin-bottom: 8px; }
  .a-val { font-size: 30px; font-weight: 600; color: #1a1a1a; line-height: 1; }
  .a-meta { font-size: 11px; color: #aaa; margin-top: 5px; }

  .y2024 { background: #e6f1fb; color: #0c447c; }
  .y2025 { background: #e1f5ee; color: #085041; }
  .y2026 { background: #eeedfe; color: #26215c; }
  .yother { background: #f1efe8; color: #444441; }

  .dot-0 { background: #1D9E75; }
  .dot-1 { background: #534AB7; }
  .dot-2 { background: #D85A30; }
  .dot-3 { background: #185FA5; }
  .dot-4 { background: #EF9F27; }
  .dot-5 { background: #993556; }
  .footer { text-align: center; font-size: 11px; color: #bbb; margin-top: 2rem; padding-bottom: 1rem; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>Crecer en Renca — Indicadores</h1>
        <p>Política de niñez · Municipalidad de Renca</p>
      </div>
      <span class="update-badge" id="update-badge">Cargando...</span>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
  </div>
  <div id="dashboard"><div class="loader">Conectando con Google Sheets...</div></div>
  <div class="footer">Datos actualizados desde Google Sheets · Crecer en Renca 2026</div>
</div>

<script>
const SHEET_ID = "1HCAw7G2ysf6VRafuZpYrxolidaPF9OvE7KJ4bv_vDRo";
const SHEET_NAME = "Indicadores";
const PROGRAM_COLORS = ["dot-0","dot-1","dot-2","dot-3","dot-4","dot-5"];
let allData = [];

async function loadSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47, text.length - 2));
    allData = json.table.rows
      .filter(r => r.c && r.c[0] && r.c[0].v)
      .map(r => ({
        programa:   r.c[0]?.v || "",
        indicador:  r.c[1]?.v || "",
        valor:      r.c[2]?.v?.toString() || "",
        comentario: r.c[3]?.v || "",
        año:        r.c[4]?.v?.toString() || ""
      }));
    renderFilters(allData);
    renderDashboard(allData);
    const now = new Date();
    document.getElementById("update-badge").textContent =
      "Actualizado " + now.toLocaleDateString("es-CL", { day:"numeric", month:"long", year:"numeric" });
  } catch(e) {
    document.getElementById("dashboard").innerHTML =
      `<div class="error-msg"><strong>No se pudo conectar con Google Sheets.</strong>Verifica que el Sheet esté público.<br><br>Error: ${e.message}</div>`;
    document.getElementById("update-badge").textContent = "Sin conexión";
  }
}

function renderFilters(data) {
  const programas = [...new Set(data.map(r => r.programa))];
  const bar = document.getElementById("filter-bar");
  bar.innerHTML = `<button class="filter-btn active" onclick="filterProgram('todos', this)">Todos</button>`;
  programas.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.textContent = p;
    btn.onclick = function() { filterProgram(p, this); };
    bar.appendChild(btn);
  });
}

function filterProgram(programa, btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const filtered = programa === "todos" ? allData : allData.filter(r => r.programa === programa);
  renderDashboard(filtered);
}

function groupBy(arr, key) {
  const map = {};
  arr.forEach(r => { if (!map[r[key]]) map[r[key]] = []; map[r[key]].push(r); });
  return map;
}

function yearClass(año) {
  if (año === "2024") return "y2024";
  if (año === "2025") return "y2025";
  if (año === "2026") return "y2026";
  return "yother";
}

function renderDashboard(data) {
  const groups = groupBy(data, "programa");
  const el = document.getElementById("dashboard");
  if (!Object.keys(groups).length) { el.innerHTML = `<div class="loader">Sin datos.</div>`; return; }

  el.innerHTML = Object.entries(groups).map(([programa, rows], i) => {
    const colorClass = PROGRAM_COLORS[i % PROGRAM_COLORS.length];
    const blockId = "block-" + i;
    const byIndicador = groupBy(rows, "indicador");

    const bodyHTML = Object.entries(byIndicador).map(([indicador, entries], j, arr) => {
      const sorted = [...entries].sort((a, b) => (a.año || "").localeCompare(b.año || ""));
      const divider = j < arr.length - 1 ? `<div class="divider"></div>` : "";

      return `
        <div class="ind-block">
          <div class="ind-label">${indicador}</div>
          <div class="a-grid">
            ${sorted.map(d => `
              <div class="a-card">
                <span class="a-badge ${yearClass(d.año)}">${d.año || "—"}</span>
                <div class="a-val">${d.valor}</div>
                ${d.comentario ? `<div class="a-meta">${d.comentario}</div>` : ""}
              </div>`).join("")}
          </div>
        </div>${divider}`;
    }).join("");

    return `
      <div class="program-block">
        <div class="program-header" onclick="toggleBlock('${blockId}')">
          <div class="program-dot ${colorClass}"></div>
          <span class="program-name">${programa}</span>
          <span class="program-count">${rows.length} indicador${rows.length !== 1 ? "es" : ""}</span>
          <span class="chevron open" id="chev-${blockId}">▼</span>
        </div>
        <div class="program-body open" id="${blockId}">${bodyHTML}</div>
      </div>`;
  }).join("");
}

function toggleBlock(id) {
  const body = document.getElementById(id);
  const chev = document.getElementById("chev-" + id);
  const isOpen = body.classList.contains("open");
  body.classList.toggle("open", !isOpen);
  chev.classList.toggle("open", !isOpen);
}

loadSheet();
</script>
</body>
</html>
