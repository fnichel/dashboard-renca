<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crecer en Renca — Indicadores 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    padding: 2rem 1rem;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .header {
    background: #fff;
    border-radius: 16px;
    padding: 2rem 2rem 1.5rem;
    margin-bottom: 1.5rem;
    border: 0.5px solid #e0dfd8;
  }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .header h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .header p { font-size: 13px; color: #888; }
  .update-badge {
    font-size: 11px;
    background: #f0f8f4;
    color: #0f6e56;
    border-radius: 20px;
    padding: 4px 12px;
    white-space: nowrap;
  }
  .filter-bar { margin-top: 1.25rem; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    border: 0.5px solid #d0cfc8;
    background: #fff;
    color: #555;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { background: #f5f4f0; }
  .filter-btn.active { background: #1a3a2a; color: #fff; border-color: #1a3a2a; }
  .loader {
    text-align: center;
    padding: 3rem;
    color: #888;
    font-size: 14px;
    background: #fff;
    border-radius: 16px;
    border: 0.5px solid #e0dfd8;
  }
  .error-msg {
    padding: 1.5rem 2rem;
    color: #712b13;
    font-size: 13px;
    background: #faece7;
    border-radius: 12px;
    line-height: 1.7;
  }
  .error-msg strong { display: block; font-size: 14px; margin-bottom: 6px; }
  .program-block {
    background: #fff;
    border-radius: 16px;
    border: 0.5px solid #e0dfd8;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .program-header {
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 0.5px solid #f0efe8;
    cursor: pointer;
    user-select: none;
  }
  .program-header:hover { background: #fafaf8; }
  .program-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .program-name { font-size: 14px; font-weight: 500; color: #1a1a1a; flex: 1; }
  .program-count { font-size: 11px; color: #aaa; }
  .chevron { font-size: 12px; color: #bbb; transition: transform 0.2s; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }
  .program-body { padding: 0 20px 16px; display: none; }
  .program-body.open { display: block; }
 
  /* Grupo de indicadores por nombre */
  .indicator-group { margin-top: 14px; border: 0.5px solid #f0efe8; border-radius: 10px; overflow: hidden; }
  .indicator-group-label {
    font-size: 11px;
    font-weight: 500;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 8px 14px 6px;
    background: #fafaf8;
    border-bottom: 0.5px solid #f0efe8;
  }
  .year-row {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 0.5px solid #f0efe8;
    gap: 12px;
  }
  .year-row:last-child { border-bottom: none; }
  .year-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 44px;
    text-align: center;
  }
  .year-2024 { background: #e6f1fb; color: #0c447c; }
  .year-2025 { background: #e1f5ee; color: #085041; }
  .year-2026 { background: #eeedfe; color: #26215c; }
  .year-other { background: #f1efe8; color: #444441; }
  .year-value { font-size: 16px; font-weight: 600; color: #1a1a1a; min-width: 70px; }
  .year-comment { font-size: 12px; color: #aaa; flex: 1; }
 
  /* Para indicadores sin comparativa (solo un año) */
  .single-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
    margin-top: 14px;
  }
  .metric-card { background: #f5f4f0; border-radius: 10px; padding: 12px 14px; position: relative; }
  .metric-label { font-size: 11px; color: #777; margin-bottom: 4px; line-height: 1.3; }
  .metric-value { font-size: 22px; font-weight: 600; color: #1a1a1a; }
  .metric-comment { font-size: 11px; color: #aaa; margin-top: 2px; }
  .metric-year-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    margin-top: 6px;
  }
 
  .footer { text-align: center; font-size: 11px; color: #bbb; margin-top: 2rem; padding-bottom: 1rem; }
  .dot-0 { background: #1D9E75; }
  .dot-1 { background: #534AB7; }
  .dot-2 { background: #D85A30; }
  .dot-3 { background: #185FA5; }
  .dot-4 { background: #EF9F27; }
  .dot-5 { background: #993556; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>Crecer en Renca — Indicadores</h1>
        <p>Política de niñez · Municipalidad de Renca</p>
      </div>
      <span class="update-badge" id="update-badge">Cargando...</span>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
  </div>
  <div id="dashboard">
    <div class="loader">Conectando con Google Sheets...</div>
  </div>
  <div class="footer">Datos actualizados desde Google Sheets · Crecer en Renca 2026</div>
</div>
 
<script>
const SHEET_ID = "1HCAw7G2ysf6VRafuZpYrxolidaPF9OvE7KJ4bv_vDRo";
const SHEET_NAME = "Indicadores";
const PROGRAM_COLORS = ["dot-0","dot-1","dot-2","dot-3","dot-4","dot-5"];
let allData = [];
 
async function loadSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47, text.length - 2));
    const rows = json.table.rows;
    allData = rows
      .filter(r => r.c && r.c[0] && r.c[0].v)
      .map(r => ({
        programa:   r.c[0]?.v || "",
        indicador:  r.c[1]?.v || "",
        valor:      r.c[2]?.v?.toString() || "",
        comentario: r.c[3]?.v || "",
        año:        r.c[4]?.v?.toString() || ""
      }));
    renderFilters(allData);
    renderDashboard(allData);
    const now = new Date();
    document.getElementById("update-badge").textContent =
      "Actualizado " + now.toLocaleDateString("es-CL", { day:"numeric", month:"long", year:"numeric" });
  } catch(e) {
    document.getElementById("dashboard").innerHTML =
      `<div class="error-msg"><strong>No se pudo conectar con Google Sheets.</strong>Verifica que el Sheet esté público (cualquier persona con el enlace → lector).<br><br>Error: ${e.message}</div>`;
    document.getElementById("update-badge").textContent = "Sin conexión";
  }
}
 
function renderFilters(data) {
  const programas = [...new Set(data.map(r => r.programa))];
  const bar = document.getElementById("filter-bar");
  bar.innerHTML = `<button class="filter-btn active" onclick="filterProgram('todos', this)">Todos</button>`;
  programas.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.textContent = p;
    btn.onclick = function() { filterProgram(p, this); };
    bar.appendChild(btn);
  });
}
 
function filterProgram(programa, btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const filtered = programa === "todos" ? allData : allData.filter(r => r.programa === programa);
  renderDashboard(filtered);
}
 
function groupByProgram(data) {
  const map = {};
  data.forEach(row => {
    if (!map[row.programa]) map[row.programa] = [];
    map[row.programa].push(row);
  });
  return map;
}
 
function groupByIndicator(rows) {
  const map = {};
  rows.forEach(row => {
    if (!map[row.indicador]) map[row.indicador] = [];
    map[row.indicador].push(row);
  });
  return map;
}
 
function yearBadgeClass(año) {
  if (año === "2024") return "year-2024";
  if (año === "2025") return "year-2025";
  if (año === "2026") return "year-2026";
  return "year-other";
}
 
function metricYearStyle(año) {
  if (año === "2024") return "background:#e6f1fb;color:#0c447c;";
  if (año === "2025") return "background:#e1f5ee;color:#085041;";
  if (año === "2026") return "background:#eeedfe;color:#26215c;";
  return "background:#f1efe8;color:#444441;";
}
 
function renderDashboard(data) {
  const groups = groupByProgram(data);
  const programas = Object.keys(groups);
  const el = document.getElementById("dashboard");
 
  if (programas.length === 0) {
    el.innerHTML = `<div class="loader">Sin datos para mostrar.</div>`;
    return;
  }
 
  el.innerHTML = programas.map((programa, i) => {
    const rows = groups[programa];
    const colorClass = PROGRAM_COLORS[i % PROGRAM_COLORS.length];
    const blockId = "block-" + i;
    const byIndicator = groupByIndicator(rows);
 
    const bodyHTML = Object.entries(byIndicator).map(([indicador, entries]) => {
      if (entries.length === 1) {
        const d = entries[0];
        return `
          <div class="single-grid">
            <div class="metric-card">
              <div class="metric-label">${d.indicador}</div>
              <div class="metric-value">${d.valor}</div>
              ${d.comentario ? `<div class="metric-comment">${d.comentario}</div>` : ""}
              ${d.año ? `<span class="metric-year-badge" style="${metricYearStyle(d.año)}">${d.año}</span>` : ""}
            </div>
          </div>`;
      } else {
        const sorted = [...entries].sort((a, b) => (a.año || "").localeCompare(b.año || ""));
        return `
          <div class="indicator-group">
            <div class="indicator-group-label">${indicador}</div>
            ${sorted.map(d => `
              <div class="year-row">
                <span class="year-badge ${yearBadgeClass(d.año)}">${d.año || "—"}</span>
                <span class="year-value">${d.valor}</span>
                <span class="year-comment">${d.comentario || ""}</span>
              </div>`).join("")}
          </div>`;
      }
    }).join("");
 
    return `
      <div class="program-block">
        <div class="program-header" onclick="toggleBlock('${blockId}')">
          <div class="program-dot ${colorClass}"></div>
          <span class="program-name">${programa}</span>
          <span class="program-count">${rows.length} indicador${rows.length !== 1 ? "es" : ""}</span>
          <span class="chevron open" id="chev-${blockId}">▼</span>
        </div>
        <div class="program-body open" id="${blockId}">
          ${bodyHTML}
        </div>
      </div>`;
  }).join("");
}
 
function toggleBlock(id) {
  const body = document.getElementById(id);
  const chev = document.getElementById("chev-" + id);
  const isOpen = body.classList.contains("open");
  body.classList.toggle("open", !isOpen);
  chev.classList.toggle("open", !isOpen);
}
 
loadSheet();
</script>
</body>
</html>
